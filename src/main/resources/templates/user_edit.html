<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Edit User: ' + user.name}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .edit-form-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 30px auto;
        }
        .edit-form-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Important for padding/width */
        }
        .btn-update {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1.1em;
        }
        .btn-cancel {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>AllTix Admin</h2>
            </div>
            <div class="nav-menu">
                <a href="/admin/dashboard" class="nav-link">Dashboard</a>
                <a href="/logout" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>
</header>

<main>
    <div class="container">
        <div class="edit-form-card">
            <h2 th:text="${'Edit User: ' + user.name}">Edit User</h2>

            <form th:action="@{/admin/users/update}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" th:field="*{name}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>

                <div class="form-group">
                    <label for="password">Password (Keep Existing or Enter New):</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>

                <div class="form-group">
                    <label for="role">Role:</label>
                    <select id="role" th:field="*{role}" required>
                        <option value="USER">USER</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>

                <button type="submit" class="btn-update">Update User</button>
                <a th:href="@{/admin/dashboard}" class="btn-cancel">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2024 AllTix. Admin Dashboard.</p>
    </div>
</footer>
</body>
</html>
