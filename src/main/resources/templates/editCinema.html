<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Cinema - AllTix Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .edit-form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .edit-form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row input, .form-row textarea {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            width: 100%;
        }
        .form-row label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        button.btn-update {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        button.btn-update:hover {
            background-color: #0056b3;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>AllTix Admin</h2>
            </div>
            <div class="nav-menu">
                <a href="/admin/dashboard" class="nav-link">Dashboard</a>
                <a href="/logout" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>
</header>

<main>
    <div class="container">
        <div class="edit-form-container">
            <h2 th:text="'Edit Cinema: ' + ${cinema.name}">Edit Cinema</h2>

            <form th:action="@{/admin/cinemas/update}" th:object="${cinema}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-row">
                    <input type="text" th:field="*{name}" placeholder="Cinema Name" required>
                    <input type="text" th:field="*{location}" placeholder="Location" required>
                </div>
                <div class="form-row">
                    <input type="text" th:field="*{city}" placeholder="City" required>
                    <input type="text" th:field="*{contactNumber}" placeholder="Contact Number" required>
                </div>
                <div class="form-row">
                    <input type="number" th:field="*{totalScreens}" placeholder="Total Screens" required>
                    <input type="text" name="facilitiesString"
                           th:value="${#strings.arrayJoin(cinema.facilities.toArray(), ', ')}"
                           placeholder="Facilities (Comma separated: IMAX, Food Court)">
                </div>

                <button type="submit" class="btn-update">Update Cinema</button>
            </form>
            <a th:href="@{/admin/dashboard}" class="btn-back">Cancel and return to Dashboard</a>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2024 AllTix. Admin Dashboard.</p>
    </div>
</footer>
</body>
</html>
